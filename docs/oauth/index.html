<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Returning to Thymer…</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 15px/1.5 -apple-system, system-ui, sans-serif; background: #111; color: #ddd; }
  .box { max-width: 420px; padding: 28px 32px; text-align: center; }
  h1 { font-size: 18px; margin: 0 0 8px; font-weight: 600; }
  p { margin: 0 0 10px; opacity: .7; }
  a { color: #6cc3a0; }
  .err { color: #e88; }
  code { font-size: 12px; word-break: break-all; opacity: .6; }
</style>
</head>
<body>
<div class="box">
  <h1 id="h">Returning to Thymer…</h1>
  <p id="p">If Thymer did not open, <a id="again" href="#">click here</a>. You can close this tab afterwards.</p>
  <p id="e" class="err" hidden></p>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var code = q.get('code'), state = q.get('state') || '', error = q.get('error');
  var h = document.getElementById('h'), p = document.getElementById('p'), e = document.getElementById('e');
  function decodeState(s) {
    try {
      var b = atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4));
      return JSON.parse(decodeURIComponent(escape(b)));
    } catch (err) { return null; }
  }
  var st = decodeState(state);
  if (error) {
    h.textContent = 'Google sign-in was not completed';
    e.textContent = error; e.hidden = false;
  }
  if (!st) {
    h.textContent = 'Nothing to do';
    p.textContent = 'This page only works as the return leg of a Thymer sign-in.';
    return;
  }
  // Web client: hand the code back to the tab that opened us.
  if (window.opener && !window.opener.closed) {
    try {
      window.opener.postMessage({ type: 'thymer-gcal-oauth', code: code, state: state, error: error }, '*');
      h.textContent = 'Done. You can close this window.';
      setTimeout(function () { window.close(); }, 800);
      return;
    } catch (err) {}
  }
  // Desktop app: go through Thymer's own thymer:// deep link.
  var url = 'thymer://' + st.h + '/plugin-action?workspaceGuid=' + encodeURIComponent(st.w || 'gcal')
    + '&action=gcal-oauth&state=' + encodeURIComponent(state)
    + (code ? '&code=' + encodeURIComponent(code) : '')
    + (error ? '&error=' + encodeURIComponent(error) : '');
  document.getElementById('again').href = url;
  location.href = url;
})();
</script>
</body>
</html>
